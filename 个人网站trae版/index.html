<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="鲍俊一的个人简历主页 —— 南京工业大学安全工程专业 2026 级，擅长 AI 编程、视频剪辑与商业 PPT 设计。">
<meta name="color-scheme" content="light dark">
<title>鲍俊一 · 个人简历主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎓%3C/text%3E%3C/svg%3E">
<!--
  ================================================================
  鲍俊一 · 个人简历主页（单文件版）
  ================================================================
  文件组织（全部与 index.html 同级目录）：
    index.html        页面主体：结构 + 样式 + 逻辑，零外链依赖
    头像.png          个人头像（Hero 区展示，加载失败自动回退 SVG 占位）
    1.jpg ~ 11.jpg    AI 技能认证证书扫描件（教育与证书区「证书墙」展示）

  代码结构（自上而下）：
    1. <style>        样式层：主题变量 → 背景层 → 导航 → 各区块组件
                      → 响应式断点 → 动效降级 → 打印样式
    2. resume         数据源：全部页面内容由该对象驱动渲染，
                      含【待补】的信息自动裁剪或隐藏
    3. 工具函数       DOM 构建助手 / 内联 SVG 图标 / 邮箱拼接 / Toast
    4. 背景层         Canvas 粒子网络 / 阅读进度条 / 鼠标光晕
    5. 区块渲染       导航 → Hero → 亮点 → 经历 → 项目 → 技能 → 教育证书
    6. 交互层         3D 卡片倾斜 / 磁性按钮 / 滚动视差 / 滚动监听
                      / 进场动画 / 数字滚动 / 灯箱预览
  ================================================================
-->
<script>
  /* 提前应用主题，避免闪烁 */
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* 忽略隐私模式下的存储异常 */ }
  })();
</script>
<style>
  /* ============ 基础与主题变量 ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #4f46e5;
    --violet: #7c3aed;
    --accent: #06b6d4;
    --gold: #e8b64c;
    --gold-bright: #f5d67b;
    --gold-soft: rgba(232, 182, 76, .35);
    --gold-glow: rgba(232, 182, 76, .18);
    --gold-text: linear-gradient(120deg, #a97a10, #f5d67b 45%, #e8b64c);
    --grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #06b6d4 130%);
    --bg: #f5f6fb;
    --bg-soft: #edeff9;
    --card: #ffffff;
    --text: #1c2130;
    --text-2: #4c5468;
    --text-3: #8a91a5;
    --line: #e4e7f0;
    --chip: #eef0fb;
    --grid-c: rgba(79, 70, 229, .07);
    --spot: rgba(232, 182, 76, .16);
    --shadow: 0 10px 30px rgba(28, 33, 48, .07);
    --shadow-lg: 0 18px 44px rgba(79, 70, 229, .16);
    --nav-bg: rgba(255, 255, 255, .82);
  }
  html[data-theme="dark"] {
    --gold-text: linear-gradient(120deg, #d9a83f, #ffe9a8 45%, #f0c25c);
    --bg: #0c0f16;
    --bg-soft: #11151f;
    --card: #151a26;
    --text: #e9ebf3;
    --text-2: #b4bacb;
    --text-3: #79819a;
    --line: #242b3c;
    --chip: #1d2434;
    --grid-c: rgba(124, 58, 237, .1);
    --spot: rgba(240, 194, 92, .13);
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    --shadow-lg: 0 18px 44px rgba(0, 0, 0, .5);
    --nav-bg: rgba(12, 15, 22, .8);
  }

  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
    overflow-x: hidden;
  }
  ::selection { background: rgba(79, 70, 229, .25); }
  a { color: var(--primary); text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }
  .ico { display: inline-flex; align-items: center; vertical-align: -2px; flex: none; }
  main { position: relative; z-index: 1; }

  /* ============ 背景层：粒子 / 进度条 / 光晕 ============ */
  #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #progressBar {
    position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 60;
    background: linear-gradient(90deg, var(--primary), var(--gold), var(--gold-bright));
    box-shadow: 0 0 10px var(--gold-soft);
    border-radius: 0 3px 3px 0;
  }
  #cursorGlow {
    position: fixed; top: 0; left: 0; width: 420px; height: 420px; z-index: 2;
    border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, var(--gold-glow) 0%, transparent 62%);
    transition: opacity .4s ease;
    will-change: transform;
  }
  #cursorGlow.on { opacity: 1; }
  html[data-theme="dark"] #cursorGlow { mix-blend-mode: screen; }

  /* ============ 导航栏 ============ */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: var(--nav-bg);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid transparent;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .nav.scrolled { border-bottom-color: var(--line); box-shadow: 0 4px 24px rgba(0, 0, 0, .09); }
  .nav-inner {
    max-width: 1080px; margin: 0 auto; height: 60px;
    display: flex; align-items: center; gap: 18px; padding: 0 20px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; color: var(--text); letter-spacing: .5px; }
  .brand-dot { width: 12px; height: 12px; border-radius: 4px; background: var(--grad); box-shadow: 0 2px 8px rgba(79, 70, 229, .5); }
  .nav-links { display: flex; gap: 4px; margin-left: auto; }
  .nav-links a {
    padding: 7px 13px; border-radius: 999px; font-size: 14px; color: var(--text-2);
    transition: color .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .nav-links a:hover { color: var(--text); background: var(--chip); box-shadow: 0 0 12px var(--gold-glow); }
  .nav-links a.active {
    color: var(--primary); background: var(--chip); font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(232, 182, 76, .35), 0 0 14px var(--gold-glow);
  }
  html[data-theme="dark"] .nav-links a.active { color: #a5b4fc; }
  .nav-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .15s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .icon-btn:hover {
    color: var(--gold); border-color: var(--gold); transform: translateY(-1px);
    box-shadow: 0 0 16px var(--gold-soft);
  }
  .nav-toggle { display: none; }

  /* ============ 通用布局 ============ */
  .section { max-width: 1080px; margin: 0 auto; padding: 68px 20px 8px; }
  .sec-head { margin-bottom: 28px; }
  .eyebrow {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--primary);
    background: var(--chip); padding: 4px 12px; border-radius: 999px; margin-bottom: 12px;
    border: 1px solid var(--line);
  }
  html[data-theme="dark"] .eyebrow { color: #a5b4fc; }
  .sec-head h2 { font-size: 27px; font-weight: 800; letter-spacing: .5px; }
  .sec-desc { color: var(--text-3); margin-top: 6px; font-size: 14px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(232, 182, 76, .5);
    box-shadow: var(--shadow-lg), 0 0 26px var(--gold-glow);
  }

  /* 3D 倾斜卡片：高光跟随鼠标 */
  .tilt { transform-style: preserve-3d; will-change: transform; position: relative; }
  .tilt::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 3;
    background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 68%);
    opacity: 0; transition: opacity .25s ease; pointer-events: none;
  }
  .tilt:hover::before { opacity: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); color: var(--text-2);
    border: 1px solid var(--line);
    font-size: 12.5px; padding: 4px 12px; border-radius: 999px; white-space: nowrap;
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .chip:hover { border-color: rgba(232, 182, 76, .55); box-shadow: 0 0 12px var(--gold-glow); transform: translateY(-1px); }
  .chip-grad { background: var(--grad); color: #fff; border-color: transparent; font-weight: 600; }
  .chip-key { font-weight: 600; color: var(--primary); border-color: rgba(79, 70, 229, .25); }
  html[data-theme="dark"] .chip-key { color: #a5b4fc; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--grad); color: #fff; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; font-family: inherit;
    padding: 11px 20px; border-radius: 12px;
    box-shadow: 0 6px 18px rgba(79, 70, 229, .3);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn:hover {
    transform: translateY(-2px); filter: brightness(1.06);
    box-shadow: 0 10px 24px rgba(79, 70, 229, .38), 0 0 20px var(--gold-soft);
  }
  .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 18px var(--gold-glow); }
  .btn-sm { padding: 7px 14px; font-size: 13px; border-radius: 10px; }
  .magnetic { will-change: transform; }

  /* ============ Hero 区 ============ */
  .hero { position: relative; overflow: hidden; padding: 138px 20px 60px; max-width: 1080px; margin: 0 auto; }
  /* 渐隐科技网格线 */
  .hero-grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--grid-c) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-c) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, .95) 0%, rgba(0, 0, 0, .4) 55%, transparent 88%);
    mask-image: linear-gradient(180deg, rgba(0, 0, 0, .95) 0%, rgba(0, 0, 0, .4) 55%, transparent 88%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .4; pointer-events: none; will-change: transform; }
  .blob-1 { width: 380px; height: 380px; top: -120px; right: -80px; background: radial-gradient(circle, #7c3aed, transparent 65%); }
  .blob-2 { width: 320px; height: 320px; bottom: -150px; left: -110px; background: radial-gradient(circle, rgba(232, 182, 76, .8), transparent 65%); }
  .hero-inner { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; align-items: center; position: relative; }

  /* 打字机 */
  .hero-type {
    font-size: 13px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 16px; min-height: 22px;
  }
  html[data-theme="dark"] .hero-type { color: var(--gold-bright); }
  .caret {
    display: inline-block; width: 2px; height: 14px; margin-left: 3px; vertical-align: -1px;
    background: var(--gold); animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .hero-eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--primary); font-weight: 600; font-size: 13.5px; background: var(--chip); border: 1px solid rgba(79, 70, 229, .2); padding: 6px 14px; border-radius: 999px; margin-bottom: 18px; }
  html[data-theme="dark"] .hero-eyebrow { color: #a5b4fc; }

  /* 名字逐字弹跳 + 光泽扫过 */
  .hero h1 { font-size: 46px; font-weight: 800; letter-spacing: 2px; line-height: 1.2; position: relative; display: inline-block; }
  .name-char { display: inline-block; opacity: 0; animation: namePop .65s cubic-bezier(.34, 1.56, .64, 1) both; }
  @keyframes namePop {
    0% { opacity: 0; transform: translateY(34px) scale(.6); }
    100% { opacity: 1; transform: none; }
  }
  .name-char.gold {
    font-style: italic;
    background: var(--gold-text);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px var(--gold-soft));
  }
  .name-shine {
    position: absolute; inset: 0; pointer-events: none; color: transparent;
    background: linear-gradient(115deg, transparent 36%, rgba(255, 255, 255, .9) 50%, transparent 64%);
    background-size: 230% 100%; background-position: 135% 0; background-repeat: no-repeat;
    -webkit-background-clip: text; background-clip: text;
    animation: shineMove 3.4s linear 1.4s infinite;
  }
  html[data-theme="dark"] .name-shine {
    background: linear-gradient(115deg, transparent 36%, rgba(245, 214, 123, .95) 50%, transparent 64%);
    background-size: 230% 100%; background-position: 135% 0; background-repeat: no-repeat;
    -webkit-background-clip: text; background-clip: text;
  }
  @keyframes shineMove { 0% { background-position: 135% 0; } 100% { background-position: -115% 0; } }

  /* Hero 时间轴错峰浮现 */
  .hero-in { opacity: 0; animation: fadeUp .7s cubic-bezier(.22, .61, .36, 1) both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: none; }
  }

  .hero-role {
    margin-top: 10px; font-size: 17px; font-weight: 700;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-summary { margin-top: 16px; color: var(--text-2); max-width: 560px; }
  .hero-chips { margin-top: 20px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .hero-mail { margin-top: 16px; color: var(--text-3); font-size: 13.5px; display: flex; align-items: center; gap: 7px; }

  /* 头像：浮动 + 双层光环 + 状态徽章 */
  .hero-side { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .avatar-wrap { position: relative; width: 210px; height: 210px; animation: floaty 5.5s ease-in-out infinite; }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .ring { position: absolute; border-radius: 50%; pointer-events: none; border: 1.5px solid transparent; }
  .ring-1 {
    inset: -11px; border-top-color: rgba(232, 182, 76, .95); border-right-color: rgba(232, 182, 76, .35);
    animation: spin 7s linear infinite;
    filter: drop-shadow(0 0 6px var(--gold-soft));
  }
  .ring-2 {
    inset: -22px; border-bottom-color: rgba(124, 58, 237, .85); border-left-color: rgba(6, 182, 212, .45);
    animation: spin 11s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar {
    width: 100%; height: 100%; border-radius: 50%; padding: 10px; background: var(--grad);
    box-shadow: var(--shadow-lg), 0 0 34px var(--gold-glow);
  }
  .avatar svg { width: 100%; height: 100%; display: block; border-radius: 50%; background: var(--card); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; background: var(--card); }
  .status-badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 800; letter-spacing: 2px;
    color: var(--text-2); background: var(--card);
    border: 1px solid rgba(232, 182, 76, .5); border-radius: 999px; padding: 6px 16px;
    box-shadow: 0 0 18px var(--gold-glow);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, .55); }
    50% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
  }
  .avatar-cap { text-align: center; color: var(--text-3); font-size: 13px; line-height: 1.8; }

  /* ============ 亮点数据 ============ */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 16px; }
  .stat { padding: 22px 20px; position: relative; overflow: hidden; }
  .stat::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--gold)); opacity: .9;
  }
  .stat-num {
    font-size: 34px; font-weight: 800; line-height: 1.2;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat-label { font-weight: 700; margin-top: 4px; font-size: 14.5px; }
  .stat-desc { color: var(--text-3); font-size: 12.5px; margin-top: 3px; }

  /* ============ Tabs ============ */
  .tab-wrap { margin-top: 4px; }
  .tablist {
    display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 6px;
    background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px;
    margin-bottom: 24px;
  }
  .tab {
    border: 0; background: transparent; cursor: pointer; font-family: inherit;
    padding: 8px 18px; border-radius: 999px; font-size: 14px; color: var(--text-2);
    transition: color .2s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] {
    background: var(--grad); color: #fff; font-weight: 600;
    box-shadow: 0 4px 14px rgba(79, 70, 229, .35), 0 0 16px var(--gold-glow);
  }
  .tab-panel[hidden] { display: none; }

  /* ============ 经历时间线 ============ */
  .timeline { position: relative; padding-left: 28px; display: grid; gap: 18px; }
  .timeline::before {
    content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 2px;
    background: linear-gradient(180deg, var(--primary), var(--gold));
    opacity: .4; border-radius: 2px;
  }
  .tl-item { padding: 22px 24px; position: relative; }
  .tl-item::before {
    content: ""; position: absolute; left: -26px; top: 30px; width: 12px; height: 12px;
    border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--primary));
    box-shadow: 0 0 0 4px var(--bg), 0 0 12px var(--gold-soft);
  }
  .tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tl-org { display: flex; align-items: center; gap: 9px; color: var(--primary); }
  html[data-theme="dark"] .tl-org { color: #a5b4fc; }
  .tl-org h3 { font-size: 17.5px; font-weight: 800; color: var(--text); }

  .points { list-style: none; display: grid; gap: 8px; }
  .points li { position: relative; padding-left: 20px; color: var(--text-2); font-size: 14px; }
  .points li::before {
    content: ""; position: absolute; left: 2px; top: 9px; width: 7px; height: 7px;
    border-radius: 2.5px; background: var(--grad); transform: rotate(45deg);
  }

  /* ============ 项目卡片 ============ */
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .proj-card { display: flex; flex-direction: column; overflow: hidden; }
  .proj-banner {
    display: flex; align-items: center; gap: 10px; padding: 16px 22px;
    color: #fff; font-weight: 700; font-size: 13.5px; letter-spacing: 1px;
    background: var(--grad);
  }
  .proj-banner.alt { background: linear-gradient(135deg, #0891b2, #6366f1); }
  .proj-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .proj-body h3 { font-size: 17px; font-weight: 800; }
  .proj-meta { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12.5px; flex-wrap: wrap; }
  .proj-body .points { flex: 1; }
  .proj-link { align-self: flex-start; }

  /* ============ 技能矩阵 ============ */
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .skill-card { padding: 22px 24px; }
  .skill-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .skill-head h3 { font-size: 16px; font-weight: 800; }
  .ico-badge {
    width: 36px; height: 36px; border-radius: 11px; display: inline-flex;
    align-items: center; justify-content: center; color: #fff; background: var(--grad);
    box-shadow: 0 4px 12px rgba(79, 70, 229, .35);
  }

  .bar { height: 10px; border-radius: 99px; background: var(--bg-soft); border: 1px solid var(--line); overflow: hidden; }

  .bar-fill {

  /* 前端发光圆点：随进度条增长实时前移，强化"正在加载"的观感 */
  .bar-fill::before {
    content: ""; position: absolute; right: 1px; top: 50%; transform: translateY(-50%);
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold-bright);

  @keyframes chipPop { to { opacity: 1; transform: none; } }

  /* ============ 教育与证书 ============ */

  .cert-item:hover { border-color: rgba(232, 182, 76, .55); transform: translateX(3px); box-shadow: 0 0 16px var(--gold-glow); }

  .cert-name { font-weight: 700; font-size: 14px; }
  .cert-issuer { color: var(--text-3); font-size: 12.5px; }

  .cert-wall {

    border-radius: 22px; border: 1px solid rgba(232, 182, 76, .28);

      radial-gradient(700px 260px at 12% 0%, rgba(232, 182, 76, .10), transparent 60%),

      var(--card);
    box-shadow: var(--shadow);
  }
  .gallery-head { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; flex-wrap: wrap; }
  .gallery-bar { width: 4px; height: 26px; border-radius: 4px; background: var(--grad); box-shadow: 0 0 12px var(--gold-glow); }
  .gallery-title h3 { font-size: 18px; font-weight: 800; }
  .gallery-title p { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
  .gallery-count {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 700; color: var(--gold);
    background: var(--chip); border: 1px solid rgba(232, 182, 76, .4);
    padding: 6px 13px; border-radius: 999px;
  }
  html[data-theme="dark"] .gallery-count { color: var(--gold-bright); }
  /* 认证构成统计带：按类别聚合，赋予证书墙"策展"结构感 */
  .cert-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .cert-stat {
    flex: 1; min-width: 150px; display: flex; align-items: center; gap: 13px;

  }
  .cert-stat:hover { border-color: rgba(232, 182, 76, .5); transform: translateY(-2px); box-shadow: 0 0 18px var(--gold-glow); }
  .cert-stat-ico {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; background: var(--grad); box-shadow: 0 4px 12px rgba(79, 70, 229, .3);
  }
  .cert-stat-num { font-size: 21px; font-weight: 800; line-height: 1.1; color: var(--gold); }
  html[data-theme="dark"] .cert-stat-num { color: var(--gold-bright); }
  .cert-stat-label { font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
  .cert-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 16px; }
  .cert-fig {
    position: relative; margin: 0; display: flex; flex-direction: column;
    border-radius: 16px; overflow: hidden; cursor: zoom-in;
    border: 1px solid var(--line);

    /* 极细金色内边框，呼应全站金色点缀语言 */

  .cert-fig:hover {

  /* 图片区 */
  .cert-imgwrap { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--bg-soft); }
  .cert-imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }

    position: absolute; right: 10px; bottom: 10px; z-index: 2;

    color: #fff; background: rgba(12, 14, 22, .55); border: 1px solid rgba(255, 255, 255, .22);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    opacity: 0; transform: translateY(6px); transition: opacity .22s ease, transform .22s ease;

  .cert-fig:hover .cert-zoom, .cert-fig:focus-visible .cert-zoom { opacity: 1; transform: none; }
  /* 信息区 */
  .cert-info { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }

  .cert-fig:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    max-width: min(92vw, 900px); max-height: 78vh; background: #fff;

  .footer-inner { max-width: 1080px; margin: 0 auto; padding: 26px 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; color: var(--text-3); font-size: 13px; }

  .to-top:hover { filter: brightness(1.08); box-shadow: 0 8px 22px rgba(79, 70, 229, .4), 0 0 20px var(--gold-soft); }
  .toast {

    .tilt::before { display: none; }
    .tablist { display: none !important; }
    .tab-panel[hidden] { display: block !important; }
    .reveal { opacity: 1 !important; transform: none !important; }
    .bar-fill { transition: none; }
    .bar-fill::after, .bar-fill::before { display: none; }
    .skill-chip { opacity: 1 !important; transform: none !important; animation: none !important; }
    .cert-gallery, .lightbox { display: none !important; }
    .proj-grid, .skills-grid, .edu-grid { gap: 12px; }
    a { color: inherit; }
    .footer { margin-top: 24px; }
  }
</style>

/* DOM 构建助手：原生创建元素，不使用任何框架 */
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
}

/* 缺失信息处理：裁剪含【待补】的分句，整句缺失则隐藏 */
function cleanPoint(text) {
  if (!text) return null;
  const parts = String(text).split(/，|,/).map(s => s.trim())
    .filter(s => s && !/【待补】|待补/.test(s));
  const out = parts.join('，');
  return out.length >= 8 ? out : null;
}

function groupBy(items, key) {
  const map = new Map();
  items.forEach(it => {
    const k = it[key] || '其他';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(it);
  });
  return [...map.entries()].map(([label, list]) => ({ label, items: list }));
}

}

/* ================================================================

 * ================================================================ */

/* Canvas 粒子网络：漂移 + 近距离连线，深浅色自动切换配色 */
function renderParticles() {
  if (REDUCED) return;
  const canvas = h('canvas', { id: 'particles', 'aria-hidden': 'true' });
  document.body.prepend(canvas);
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, raf = null, running = false;
  const parts = [];

  const palette = () => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    return dark
      ? { dot: [167, 139, 250], line: [167, 139, 250], gold: [240, 194, 92] }
      : { dot: [79, 70, 229], line: [79, 70, 229], gold: [201, 148, 38] };
  };
  /* 粒子配色随主题平滑渐变：切换时对 RGB 做 500ms 插值 */
  let colors = palette();
  let lerpRaf = null;
  const lerpPalette = () => {
    const from = { dot: colors.dot.slice(), line: colors.line.slice(), gold: colors.gold.slice() };
    const to = palette();
    const t0 = performance.now(), dur = 500;
    cancelAnimationFrame(lerpRaf);
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      ['dot', 'line', 'gold'].forEach(k => {
        colors[k] = from[k].map((v, i) => Math.round(v + (to[k][i] - v) * e));
      });
      if (p < 1) lerpRaf = requestAnimationFrame(step);
    })(t0);
  };

  const spawn = () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
    r: Math.random() * 1.7 + .7, gold: Math.random() < .14
  });

  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const target = Math.min(88, Math.round(W * H / 16000));
    while (parts.length < target) parts.push(spawn());
    parts.length = target;
  };

  const LINK = 112;
  const step = () => {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      const base = p.gold ? colors.gold : colors.dot;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + base.join(',') + ',' + (p.gold ? '0.75)' : '0.5)');
      ctx.fill();
    }
    ctx.lineWidth = 1;
    for (let i = 0; i < parts.length; i++) {
      const a = parts[i];
      for (let j = i + 1; j < parts.length; j++) {
        const b = parts[j];
        const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 < LINK * LINK) {
          const alpha = (1 - Math.sqrt(d2) / LINK) * .32;
          ctx.strokeStyle = 'rgba(' + colors.line.join(',') + ',' + alpha + ')';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(step);
  };

  /* 主题切换时平滑渐变粒子配色 */
  new MutationObserver(() => { REDUCED ? (colors = palette()) : lerpPalette(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); running = false; }
    else if (!running) { running = true; step(); }
  });

  resize();
  running = true;
  step();
}

function renderCursorGlow() {
  if (!FINE_POINTER || REDUCED) return;
  const glow = h('div', { id: 'cursorGlow', 'aria-hidden': 'true' });
  document.body.append(glow);
  let tx = -600, ty = -600, x = tx, y = ty, shown = false;
  window.addEventListener('mousemove', e => {
    tx = e.clientX; ty = e.clientY;
    if (!shown) { shown = true; glow.classList.add('on'); }
  }, { passive: true });
  document.addEventListener('mouseleave', () => { shown = false; glow.classList.remove('on'); });
  const SIZE = 420;
  (function loop() {
    x += (tx - x) * .13;
    y += (ty - y) * .13;
    glow.style.transform = 'translate(' + (x - SIZE / 2) + 'px,' + (y - SIZE / 2) + 'px)';
    requestAnimationFrame(loop);
  })();
}

  themeBtn.addEventListener('click', e => {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    const apply = () => {
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (err) { /* 忽略 */ }
      applyThemeIcon(true);
    };

    /* 优先使用 View Transitions：从按钮位置圆形扩散揭示新主题 */
    if (!REDUCED && document.startViewTransition) {
      const x = e.clientX, y = e.clientY;
      const vt = document.startViewTransition(apply);
      vt.ready.then(() => {
        const endR = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
        document.documentElement.animate(
          { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + endR + 'px at ' + x + 'px ' + y + 'px)'] },
          { duration: 560, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(() => {});
    } else {
      /* 降级：全局颜色类过渡 */
      root.classList.add('theme-anim');
      apply();
      setTimeout(() => root.classList.remove('theme-anim'), 550);
    }
  });
  applyThemeIcon();

  /* 打印 */
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  /* 背景音乐 */
  setupMusicToggle();

  /* 移动端菜单 */
  const navLinks = document.getElementById('navLinks');
  document.getElementById('navToggle').addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.addEventListener('click', e => { if (e.target.tagName === 'A') navLinks.classList.remove('open'); });
}

/* ================================================================
 * 背景音乐：Web Audio API 合成轻柔纯音乐
 * 钢琴音色 arpeggio + 柔和 pad + 低频 bass，C 大调 70BPM
 * ================================================================ */
function setupMusicToggle() {
  const btn = document.getElementById('musicToggle');
  let ctx = null, masterGain = null, playing = false, schedulerId = null;
  let nextNoteTime = 0, step = 0, autoStarted = false;

  // C 大调音阶（Hz），从低到高
  const SCALE = [
    130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94,
    261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88,
    523.25, 587.33, 659.25
  ];

  // 和弦进行（C - G/B - Am - F），经典温柔走向
  const CHORDS = [
    { bass: 0,  notes: [7, 9, 11] },   // C
    { bass: 6,  notes: [6, 9, 11] },   // G/B
    { bass: 5,  notes: [8, 10, 12] },  // Am
    { bass: 3,  notes: [7, 9, 12] }    // F
  ];

  // arpeggio 指法
  const ARP_PATTERNS = [
    [0, 1, 2, 1, 0, 1, 2, 1],
    [0, 2, 1, 2, 0, 2, 1, 2],
    [0, 1, 2, 1, 2, 1, 0, 1],
    [0, 2, 0, 1, 2, 1, 0, 2]
  ];

  const BPM = 60;           // 更慢的节奏
  const STEP_DUR = 60 / BPM / 2;

  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = 0;
    // 低通滤波器：让音色更柔和温暖
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1400;  // 截掉高频，更柔
    filter.Q.value = 0.5;
    // 延迟混响
    const delay = ctx.createDelay();
    delay.delayTime.value = 0.35;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.28;
    const wet = ctx.createGain();
    wet.gain.value = 0.18;
    delay.connect(feedback);
    feedback.connect(delay);
    masterGain.connect(filter);
    filter.connect(ctx.destination);
    masterGain.connect(delay);
    delay.connect(wet);
    wet.connect(filter);
  }

  // 合成钢琴音色：纯正弦波，极柔和起音
  function playNote(freq, time, dur, vol) {
    vol = vol || 0.5;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;

    const gain = ctx.createGain();
    // 更柔和的 ADSR：慢起音 + 长衰减
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.08);     // 慢起音
    gain.gain.exponentialRampToValueAtTime(vol * 0.3, time + dur * 0.5);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(time);
    osc.stop(time + dur + 0.1);
  }

  // 合成 pad 音色：长持续柔和弦乐
  function playPad(freq, time, dur, vol) {
    vol = vol || 0.12;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 3;       // 更慢的颤音
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 1.0;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.6);      // 更慢淡入
    gain.gain.linearRampToValueAtTime(vol * 0.7, time + dur * 0.6);
    gain.gain.linearRampToValueAtTime(0.0001, time + dur);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(time);
    lfo.start(time);
    osc.stop(time + dur + 0.1);
    lfo.stop(time + dur + 0.1);
  }

  // 合成 bass 音色
  function playBass(freq, time, dur, vol) {
    vol = vol || 0.18;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(time);
    osc.stop(time + dur + 0.1);
  }

  // 调度器
  function scheduler() {
    while (nextNoteTime < ctx.currentTime + 0.3) {
      const chordIdx = Math.floor(step / 8) % CHORDS.length;
      const chord = CHORDS[chordIdx];
      const arpPat = ARP_PATTERNS[chordIdx];
      const stepInChord = step % 8;

      // arpeggio 音（降低音量）
      const noteIdx = chord.notes[arpPat[stepInChord]];
      playNote(SCALE[noteIdx], nextNoteTime, STEP_DUR * 2.2, 0.09);

      // 每和弦第一拍：bass + pad
      if (stepInChord === 0) {
        playBass(SCALE[chord.bass], nextNoteTime, STEP_DUR * 8 * 0.95, 0.08);
        chord.notes.forEach(n => {
          playPad(SCALE[n], nextNoteTime, STEP_DUR * 8 * 0.98, 0.04);
        });
      }

      nextNoteTime += STEP_DUR;
      step++;
    }
    schedulerId = setTimeout(scheduler, 80);
  }

  function start() {
    if (!ctx) init();
    if (ctx.state === 'suspended') ctx.resume();
    nextNoteTime = ctx.currentTime + 0.1;
    step = 0;
    // 淡入（更慢）
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.32, ctx.currentTime + 2.0);
    scheduler();
    playing = true;
    btn.classList.add('playing');
    btn.setAttribute('aria-label', '暂停背景音乐');
    btn.replaceChildren(icon('music', 17));
  }

  function stop() {
    if (schedulerId) { clearTimeout(schedulerId); schedulerId = null; }
    if (ctx) {
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
    }
    playing = false;
    btn.classList.remove('playing');
    btn.setAttribute('aria-label', '播放背景音乐');
    btn.replaceChildren(icon('musicOff', 17));
  }

  btn.addEventListener('click', () => {
    if (playing) stop(); else start();
  });

  // 自动播放：浏览器策略要求用户首次交互后才可播放音频
  // 监听首次任意交互，自动开始播放
  function tryAutoStart() {
    if (!autoStarted) {
      autoStarted = true;
      start();
    }
  }
  // 首次点击/按键/触摸时自动播放
  ['click', 'keydown', 'touchstart'].forEach(evt => {
    document.addEventListener(evt, tryAutoStart, { once: true, passive: true });
  });
  // 如果用户已交互过（如从其他标签回来），延迟尝试
  if (document.hasFocus && document.hasFocus()) {
    setTimeout(() => { if (!autoStarted) tryAutoStart(); }, 800);
  }

  // 页面失去焦点时暂停
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) stop();
  });
}

/* ================================================================
 * Tabs 通用构建（ARIA + 键盘左右切换）
 * ================================================================ */
function wireTabs(tabs, panels) {
  const activate = (i, focus) => {
    tabs.forEach((t, k) => {
      const on = k === i;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      panels[k].hidden = !on;
    });
    if (focus) tabs[i].focus();
  };
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => activate(i));
    t.addEventListener('keydown', e => {
      let j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = tabs.length - 1;
      if (j !== null) { e.preventDefault(); activate(j, true); }
    });
  });
  activate(0);
}

function buildTabGroup(prefix, ariaLabel, groups, renderPanel) {
  const defs = [{ key: 'all', label: '全部', items: groups.flatMap(g => g.items) }, ...groups];
  const tablist = h('div', { class: 'tablist', role: 'tablist', 'aria-label': ariaLabel });
  const tabs = [], panels = [];
  defs.forEach((def, i) => {
    const btn = h('button', {
      class: 'tab', role: 'tab', type: 'button',
      id: prefix + '-tab-' + i, 'aria-controls': prefix + '-panel-' + i
    }, def.label + '（' + def.items.length + '）');
    tablist.append(btn);
    tabs.push(btn);
    const panel = h('div', {
      class: 'tab-panel', role: 'tabpanel',
      id: prefix + '-panel-' + i, 'aria-labelledby': prefix + '-tab-' + i, tabindex: '0'
    });
    renderPanel(panel, def.items);
    panels.push(panel);
  });
  wireTabs(tabs, panels);
  return h('div', { class: 'tab-wrap' }, tablist, ...panels);
}

    h('div', {}, h('span', { class: 'chip' }, icon('calendar', 13), edu.period)),
    h('p', { class: 'edu-label' }, '核心课程'),
    h('div', { class: 'chips' }, edu.courses.map(c => h('span', { class: 'chip' }, c))),
    edu.note ? h('p', { class: 'edu-note' }, icon('sparkles', 15), edu.note) : null
  ) : null;

  const certCard = certs.length ? h('div', { class: 'card tilt cert-card reveal', style: { transitionDelay: '80ms' } },
    h('div', { class: 'cert-head' },
      h('span', { class: 'ico-badge' }, icon('award', 20)),
      h('h3', {}, '获奖与证书'),
      h('span', { class: 'chip chip-grad' }, certs.length + ' 项')
    ),
    h('ul', { class: 'cert-list' }, certs.map(c =>
      h('li', { class: 'cert-item' },
        icon('check', 15, 'cert-ico'),
        h('div', {},
          h('p', { class: 'cert-name' }, c.name),
          h('p', { class: 'cert-issuer' }, c.issuer + (c.tag ? ' · ' + c.tag : ''))
        )
      )
    ))
  ) : null;

  main.append(
    h('section', { class: 'section', id: 'education', 'aria-label': '教育背景与证书' },
      h('div', { class: 'sec-head reveal' },
        h('span', { class: 'eyebrow' }, 'Education'),
        h('h2', {}, '教育背景与证书'),
        h('p', { class: 'sec-desc' }, '安全工程 × 人工智能的复合知识体系')
      ),
      h('div', { class: 'edu-grid' }, eduCard, certCard),
      renderCertGallery()
    )
  );
}

/* ================================================================
 * 渲染：证书墙画廊 + 灯箱大图预览
 * ================================================================ */
function renderCertGallery() {
  const imgs = resume.certImages || [];
  if (!imgs.length) return null;

  const gallery = h('div', { class: 'cert-gallery reveal' },
    imgs.map((c, i) =>
      h('figure', {
        class: 'cert-fig', tabindex: '0', role: 'button',
        'data-index': i, 'aria-label': '查看大图：' + c.label,
        style: { animationDelay: (i * 60) + 'ms' }
      },
        /* 图片区：编号角标 + 证书图 + 悬停放大按钮 */
        h('div', { class: 'cert-imgwrap' },
          h('span', { class: 'cert-num', 'aria-hidden': 'true' }, String(i + 1).padStart(2, '0')),
          h('img', { src: c.src, alt: c.label, loading: 'lazy' }),
          h('span', { class: 'cert-zoom', 'aria-hidden': 'true' }, icon('zoom', 15))
        ),
        /* 信息区：标题 + 分类标签 */
        h('figcaption', { class: 'cert-info' },
          h('span', { class: 'cert-title' }, c.label),
          h('span', { class: 'cert-tag' }, c.tag || '认证')
        )
      )
    )
  );

  /* 灯箱 */
  const lbImg = h('img', { class: 'lb-img', alt: '' });
  const lbCap = h('p', { class: 'lb-cap', 'aria-live': 'polite' });
  const lightbox = h('div', { class: 'lightbox', id: 'lightbox', role: 'dialog', 'aria-modal': 'true', 'aria-label': '证书大图预览' },
    h('button', { class: 'lb-close', type: 'button', 'aria-label': '关闭预览' }, icon('close', 20)),
    lbImg, lbCap
  );
  document.body.append(lightbox);

  let lastFocus = null;
  let cur = 0;
  const openLb = i => {
    cur = (i + imgs.length) % imgs.length;
    const c = imgs[cur];
    lbImg.src = c.src;
    lbImg.alt = c.label;
    lbCap.textContent = c.label + ' · ' + (cur + 1) + ' / ' + imgs.length;
    lastFocus = document.activeElement;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    lightbox.querySelector('.lb-close').focus();
  };
  const closeLb = () => {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  };

  gallery.addEventListener('click', e => {
    const fig = e.target.closest('.cert-fig');
    if (fig) openLb(+fig.dataset.index);
  });
  gallery.addEventListener('keydown', e => {
    const fig = e.target.closest('.cert-fig');
    if (fig && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLb(+fig.dataset.index); }
  });
  lightbox.addEventListener('click', e => {
    if (e.target === lightbox || e.target.closest('.lb-close')) closeLb();
  });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowRight') openLb(cur + 1);
    else if (e.key === 'ArrowLeft') openLb(cur - 1);
  });

  /* 认证构成统计带：按 tag 聚合各类别证书数量 */
  const tagOrder = ['人工智能', '云计算', '大模型'];
  const tagIcon = { '人工智能': 'cpu', '云计算': 'cloud', '大模型': 'sparkles' };
  const counts = {};
  imgs.forEach(c => { const t = c.tag || '认证'; counts[t] = (counts[t] || 0) + 1; });
  const statTags = tagOrder.filter(t => counts[t]);
  Object.keys(counts).forEach(t => { if (!statTags.includes(t)) statTags.push(t); });
  const stats = statTags.length > 1 ? h('div', { class: 'cert-stats' },
    statTags.map(t =>
      h('div', { class: 'cert-stat' },
        h('span', { class: 'cert-stat-ico', 'aria-hidden': 'true' }, icon(tagIcon[t] || 'award', 19)),
        h('div', {},
          h('div', { class: 'cert-stat-num' }, counts[t] + ' 项'),
          h('div', { class: 'cert-stat-label' }, t + '认证')
        )
      )
    )
  ) : null;

  return h('div', { class: 'cert-wall reveal' },
    h('div', { class: 'gallery-head' },
      h('span', { class: 'gallery-bar', 'aria-hidden': 'true' }),
      h('div', { class: 'gallery-title' },
        h('h3', {}, '证书墙'),
        h('p', {}, 'AI 技能认证证书原件 · 点击任意一张查看大图')
      ),
      h('span', { class: 'gallery-count' }, icon('award', 14), '共 ' + imgs.length + ' 项认证')
    ),
    stats,
    gallery
  );
}

/* ================================================================
 * 交互：3D 卡片倾斜 / 磁性按钮
 * ================================================================ */

/* 3D 倾斜：卡片跟随视角旋转，高光随鼠标移动（仅精确指针设备） */
function setupTilt() {
  if (!FINE_POINTER || REDUCED) return;
  document.querySelectorAll('.tilt').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const rx = (0.5 - py) * 6.5;
      const ry = (px - 0.5) * 6.5;
      card.style.transform = 'perspective(900px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg) translateY(-4px)';
      card.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
      card.style.setProperty('--my', (py * 100).toFixed(1) + '%');
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  });
}

/* 磁性按钮：光标靠近时按钮被"吸引" */
function setupMagnetic() {
  if (!FINE_POINTER || REDUCED) return;
  document.querySelectorAll('.magnetic').forEach(btn => {
    btn.addEventListener('mousemove', e => {
      const r = btn.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      btn.style.transform = 'translate(' + (dx * .22).toFixed(1) + 'px,' + (dy * .28).toFixed(1) + 'px)';
    });
    btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
  });
}

/* 滚动视差：带 data-parallax 的元素按各自速率随滚动位移，形成景深
 * 速率为正 → 元素滚动更快；为负 → 元素滞后于滚动（经典视差）
 * 偏移基于初始基准位置计算（避免自引用漂移），rAF 节流保证流畅 */
function setupParallax() {
  if (REDUCED) return;
  const items = [...document.querySelectorAll('[data-parallax]')].map(el => ({
    el, speed: parseFloat(el.dataset.parallax) || 0.15, base: 0, height: 0
  }));
  if (!items.length) return;

  /* 记录各元素未偏移时的文档基准位置（resize 后重测） */
  const measure = () => {
    items.forEach(it => {
      it.el.style.transform = '';
      const r = it.el.getBoundingClientRect();
      it.base = r.top + window.scrollY;
      it.height = r.height;
    });
  };

  let ticking = false;
  const update = () => {
    ticking = false;
    const vh = window.innerHeight;
    const y = window.scrollY;
    for (const it of items) {
      /* 视口剔除：元素完全离开视口附近时跳过计算 */
      if (it.base + it.height < y - 120 || it.base > y + vh + 120) continue;
      const centerInViewport = it.base + it.height / 2 - y - vh / 2;
      it.el.style.transform = 'translate3d(0,' + (centerInViewport * it.speed).toFixed(1) + 'px,0)';
    }
  };
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { measure(); onScroll(); });
  measure();
  update();
}

/* ================================================================
 * 交互：滚动监听 / 进场动画 / 数字滚动 / 进度条
 * ================================================================ */
function countUp(el, dur) {
  if (el.dataset.done) return;
  el.dataset.done = '1';
  const target = parseFloat(el.dataset.count);
  const suffix = el.dataset.suffix || '';
  if (REDUCED || isNaN(target)) { el.textContent = target + suffix; return; }
  dur = dur || 900;
  const t0 = performance.now();
  (function tick(now) {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

/* 技能进度条动态加载：滚动进入视口后，rAF 逐帧驱动宽度与百分比
 * 从 0 同步增长（1.5s 缓出），多条错峰 200ms；
 * 增长期间圆点呼吸脉冲 + 百分比金色光晕，完成后追加流光效果 */
function fillSkillBar(bar) {
  if (bar.dataset.done) return;
  bar.dataset.done = '1';
  const level = parseFloat(bar.dataset.level);
  const delay = parseInt(bar.dataset.delay || '0', 10);
  const pct = bar.closest('.skill-row').querySelector('.skill-pct');
  if (REDUCED || isNaN(level)) {
    bar.style.width = level + '%';
    if (pct) { pct.textContent = level + '%'; pct.dataset.done = '1'; }
    bar.classList.add('filled');
    return;
  }
  const dur = 1500;
  const t0 = performance.now() + delay;
  bar.classList.add('loading');
  if (pct) pct.classList.add('counting');
  (function step(now) {
    const p = Math.min(1, Math.max(0, (now - t0) / dur));
    const eased = 1 - Math.pow(1 - p, 3); /* easeOutCubic：先快后缓更自然 */
    bar.style.width = (level * eased).toFixed(1) + '%';
    if (pct) pct.textContent = Math.round(level * eased) + '%';
    if (p < 1) requestAnimationFrame(step);
    else {
      bar.classList.remove('loading');
      bar.classList.add('filled');
      if (pct) { pct.classList.remove('counting'); pct.dataset.done = '1'; }
    }
  })(performance.now());
}

function setupReveal() {
  const reveals = document.querySelectorAll('.reveal');
  const finish = el => {
    el.classList.add('visible');
    if (el.classList.contains('stat')) {
      const num = el.querySelector('.stat-num');
      if (num) countUp(num);
    }
  };
  if (REDUCED || !('IntersectionObserver' in window)) {
    reveals.forEach(finish);
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      finish(en.target);
      io.unobserve(en.target);
    });
  }, { threshold: 0.15 });
  reveals.forEach(el => io.observe(el));
}

/* 技能进度条独立触发：监听整行 .skill-row 的可见性（而非初始宽度为 0 的
 * .bar-fill——零面积元素无法满足交叉阈值，观察器将永不触发），
 * 滚动到该行进入屏幕中下部时才驱动内部进度条从 0 开始增长 */
function setupSkillBars() {
  const rows = document.querySelectorAll('.skill-row');
  if (!rows.length) return;
  if (REDUCED || !('IntersectionObserver' in window)) {
    rows.forEach(r => { const b = r.querySelector('.bar-fill'); if (b) fillSkillBar(b); });
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const bar = en.target.querySelector('.bar-fill');
      if (bar) fillSkillBar(bar);
      io.unobserve(en.target);
    });
  }, { threshold: 0.6, rootMargin: '0px 0px -10% 0px' });
  rows.forEach(r => io.observe(r));
}

function setupScrollSpy(progressBar) {
  const nav = document.getElementById('siteNav');
  const toTop = document.getElementById('toTop');
  const links = document.querySelectorAll('.nav-links a');
  const ids = NAV_LINKS.map(l => l.id);
  let ticking = false;
  const update = () => {
    ticking = false;
    const y = window.scrollY;
    nav.classList.toggle('scrolled', y > 8);
    toTop.classList.toggle('show', y > 480);
    /* 顶部金色阅读进度条 */
    const max = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = (max > 0 ? Math.min(100, y / max * 100) : 0) + '%';
    let current = null;
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el && el.offsetTop <= y + 130) current = id;
    });
    links.forEach(a => a.classList.toggle('active', a.dataset.target === current));
  };
  window.addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  window.addEventListener('resize', update);
  update();
}

/* 打印前确保所有内容可见、进度条与数字到位 */
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.reveal, .hero-in').forEach(el => el.classList.add('visible'));
  document.querySelectorAll('.bar-fill').forEach(b => {
    b.style.width = b.dataset.level + '%';
    b.dataset.done = '1';
  });
  document.querySelectorAll('.stat-num').forEach(el => {
    if (!el.dataset.done) { el.textContent = el.dataset.count + (el.dataset.suffix || ''); el.dataset.done = '1'; }
  });
  document.querySelectorAll('.skill-pct').forEach(el => {
    if (!el.dataset.done) { el.textContent = el.dataset.count + '%'; el.dataset.done = '1'; }
  });
  const typed = document.getElementById('typeText');
  if (typed) typed.textContent = '个人简历 / PORTFOLIO';
});

/* ================================================================
 * 启动
 * ================================================================ */
(function init() {
  const main = document.getElementById('main');
  renderParticles();

  renderCursorGlow();

  renderProjects(main);
  renderSkills(main);
  renderEducation(main);
  renderFooter();
  setupReveal();
  setupSkillBars();
  setupTilt();
  setupMagnetic();
  setupParallax();
  setupScrollSpy(progressBar);
})();
</script>
