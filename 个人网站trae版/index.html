<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="鲍俊一的个人简历主页 —— 南京工业大学安全工程专业 2026 级，擅长 AI 编程、视频剪辑与商业 PPT 设计。">
<meta name="color-scheme" content="light">
<title>鲍俊一 · 个人简历主页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">

<!-- 字体：Plus Jakarta Sans（英文/数字）+ Noto Serif SC（中文正文）+ Zhi Mang Xing / STXingkai（行楷标题） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Zhi+Mang+Xing&display=swap">

<!-- Tailwind CSS（Play CDN，运行时生成工具类样式） -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', '"Noto Serif SC"', 'system-ui', '-apple-system', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
          serif: ['"Noto Serif SC"', '"Songti SC"', 'STSong', 'serif'],
          heading: ['"Zhi Mang Xing"', '"STXingkai"', '"KaiTi"', '"Noto Serif SC"', 'cursive']
        },
        colors: {
          ink: {
            950: '#15181c',
            900: '#262a30',
            800: '#3a4047',
            700: '#525a62',
            600: '#6c747c',
            500: '#848c93',
            200: '#c6c9c7',
            100: '#e9e6de'
          },
          water: {
            300: '#b9c7cf',
            400: '#8fa4b0',
            500: '#718a98',
            600: '#5b7482'
          },
          seal: '#a94438',
          paper: '#f5f0e6',
          wash: '#e6ddcd'
        }
      }
    }
  };
</script>

<!-- Lucide 线性图标库 -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!--
  ================================================================
  鲍俊一 · 个人简历主页（单文件版 · 水墨涟漪风）
  ----------------------------------------------------------------
  技术栈：Tailwind CSS（Play CDN） + Lucide Icons + 多字重中文字体
  结构：墨晕光斑 → 水滴涟漪 → 导航 → Hero → 亮点看板 → 经历时间轴 → 项目 →
        技能矩阵 → 教育与证书墙 → 页脚
  数据：全部由下方 resume 对象驱动渲染，确保文字/图片/链接不变。
  ================================================================
-->
<style>
  /* ============ 基础 ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: light;
    --ink-bg: #f5f0e6;
    --ink-panel: rgba(255, 255, 255, .68);
    --ink-line: rgba(38, 42, 48, .12);
    --water: #5b7482;
    --water-strong: #718a98;
    --seal: #a94438;
    --paper: #f5f0e6;
    --wash: #e6ddcd;
  }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body {
    font-family: "Plus Jakarta Sans", "Noto Serif SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 760px at -8% 112%, rgba(27, 29, 31, .22), transparent 62%),
      radial-gradient(980px 620px at 112% -8%, rgba(27, 29, 31, .14), transparent 62%),
      radial-gradient(1100px 540px at 12% -6%, rgba(255, 255, 255, .84), transparent 62%),
      radial-gradient(980px 560px at 92% 108%, rgba(120, 118, 108, .1), transparent 66%),
      linear-gradient(180deg, #f7f2e9 0%, #efe7d9 48%, #f4efe5 100%);
    color: #2c3136;
    line-height: 1.9;
    letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .12;
    mix-blend-mode: multiply;
    background-image:
      radial-gradient(ellipse at 20% 18%, rgba(63,61,55,.28) 0 1px, transparent 1.5px),
      radial-gradient(ellipse at 78% 64%, rgba(63,61,55,.2) 0 1px, transparent 1.5px);
    background-size: 130px 170px, 190px 230px;
  }
  ::selection { background: rgba(44, 49, 54, .16); color: #15181c; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--water); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .ico { display: inline-flex; align-items: center; vertical-align: -2px; flex: none; }
  main { position: relative; z-index: 1; }

  /* ============ 字体系统 ============ */
  /* 正文：Noto Serif SC 宋体骨架，保持叙述文字的舒展感 */
  body, .font-serif { font-family: "Plus Jakarta Sans", "Noto Serif SC", "Songti SC", STSong, serif; }
  /* 行楷标题：Zhi Mang Xing + 系统 STXingkai，比叙述文字更大、更松 */
  .font-art, .font-eleg, .font-display { font-family: 'Zhi Mang Xing', 'STXingkai', 'KaiTi', 'Noto Serif SC', cursive; letter-spacing: .02em; }
  /* 专有名词：比叙述文字更大、更重，但不用艺术字 */
  .proper {
    font-family: 'Noto Serif SC', 'Songti SC', STSong, serif;
    font-size: 1.16em;
    font-weight: 700;
    line-height: 1.45;
    letter-spacing: .01em;
    color: #15181c;
  }
  h1.proper, h2.proper, h3.proper, h4.proper, p.proper, span.proper {
    font-size: 1.16em;
    line-height: 1.45;
  }
  /* 姓名 / 标题柔光，强化墨色层次 */
  .name-glow { filter: drop-shadow(0 6px 18px rgba(44, 49, 54, .14)); }
  .title-glow { filter: drop-shadow(0 5px 14px rgba(44, 49, 54, .1)); }

  /* ============ 背景层：墨晕光斑 / 雨滴涟漪 / 进度条 / 光晕 ============ */
  .glow { position: fixed; border-radius: 9999px; filter: blur(140px); pointer-events: none; z-index: 0; }
  .glow-cyan { top: -180px; left: -160px; width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(230, 221, 205, .95), transparent 60%); opacity: .32; }
  .glow-indigo { bottom: -200px; right: -180px; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(105, 112, 116, .28), transparent 60%); opacity: .24; }

  #ripples { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #progressBar {
    position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 60;
    background: linear-gradient(90deg, #5b7482, #262a30 48%, #a94438);
    box-shadow: 0 0 10px rgba(44, 49, 54, .18);
    border-radius: 0 3px 3px 0;
  }
  #cursorGlow {
    position: fixed; top: 0; left: 0; width: 460px; height: 460px; z-index: 2;
    border-radius: 50%; pointer-events: none; opacity: 0; mix-blend-mode: multiply;
    background: radial-gradient(circle, rgba(230, 221, 205, .7) 0%, transparent 62%);
    transition: opacity .4s ease; will-change: transform;
  }
  #cursorGlow.on { opacity: 1; }

  /* ============ 导航栏（宣纸毛玻璃） ============ */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: rgba(247, 242, 233, .78);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(38, 42, 48, .1);
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .nav.scrolled { border-bottom-color: rgba(38,42,48,.18); box-shadow: 0 4px 28px rgba(58, 53, 45, .12); }
  .brand-dot { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #9aa7ad 48%, #5b7482); box-shadow: 0 0 14px rgba(91,116,130,.25); }
  .nav-links a {
    padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: #5b626b;
    letter-spacing: .08em; transition: color .2s ease, background-color .2s ease;
  }
  .nav-links a:hover { color: #15181c; background: rgba(91,116,130,.1); }
  .nav-links a.active { color: #15181c; background: rgba(91,116,130,.16); font-weight: 600; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(38,42,48,.14);
    background: rgba(255,255,255,.28); color: #3a4047; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .15s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .icon-btn:hover { color: #15181c; border-color: rgba(91,116,130,.55); transform: translateY(-1px); box-shadow: 0 0 18px rgba(91,116,130,.18); }

  /* ============ 通用 ============ */
  .card {
    background: var(--ink-panel);
    border: 1px solid var(--ink-line);
    border-radius: 1rem; /* rounded-2xl */
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: 0 14px 40px rgba(58, 53, 45, .09), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }

  /* 3D 倾斜卡片：高光跟随鼠标 */
  .tilt { transform-style: preserve-3d; will-change: transform; position: relative; }
  .tilt::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 3; pointer-events: none;
    background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(91,116,130,.16), transparent 68%);
    opacity: 0; transition: opacity .25s ease;
  }
  .tilt:hover::before { opacity: 1; }

  /* ============ Hero ============ */
  .hero-grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(91,116,130,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,116,130,.055) 1px, transparent 1px);
    background-size: 58px 58px;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.3) 55%, transparent 88%);
    mask-image: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.3) 55%, transparent 88%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .3; pointer-events: none; will-change: transform; }
  .blob-1 { width: 360px; height: 360px; top: -120px; right: -80px; background: radial-gradient(circle, rgba(255,255,255,.95), transparent 65%); animation: blobDrift 19s ease-in-out infinite; }
  .blob-2 { width: 320px; height: 320px; bottom: -150px; left: -110px; background: radial-gradient(circle, rgba(105,112,116,.32), transparent 65%); animation: blobDrift 23s ease-in-out infinite reverse; }
  @keyframes blobDrift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(24px,-28px) scale(1.08); } }

  .hero-type { font-size: 13px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: #5b7482; min-height: 20px; }
  .caret { display: inline-block; width: 2px; height: 14px; margin-left: 3px; vertical-align: -1px; background: #5b7482; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .hero h1 { line-height: 1.08; letter-spacing: .02em; }
  .name-char { display: inline-block; opacity: 0; animation: namePop .65s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes namePop { 0% { opacity: 0; transform: translateY(34px) scale(.6); } 100% { opacity: 1; transform: none; } }
  .name-shine {
    position: absolute; inset: 0; pointer-events: none; color: transparent;
    background: linear-gradient(115deg, transparent 36%, rgba(255,255,255,.9) 50%, transparent 64%);
    background-size: 230% 100%; background-position: 135% 0; background-repeat: no-repeat;
    -webkit-background-clip: text; background-clip: text;
    animation: shineMove 3.4s linear 1.4s infinite;
  }
  @keyframes shineMove { 0% { background-position: 135% 0; } 100% { background-position: -115% 0; } }
  .hero-in { opacity: 0; animation: fadeUp .7s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

  #roleRotate { display: inline-block; transition: opacity .3s ease, transform .3s ease; color: #3a4047; font-family: 'Zhi Mang Xing', 'STXingkai', 'KaiTi', 'Noto Serif SC', cursive; font-size: 1.16em; letter-spacing: .03em; }
  #roleRotate.swap-out { opacity: 0; transform: translateY(-9px); }

  /* 头像浮动 + 光环 */
  .avatar-wrap { animation: floaty 5.5s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .ring { position: absolute; border-radius: 50%; pointer-events: none; border: 1.5px solid transparent; }
  .ring-1 { inset: -11px; border-top-color: rgba(91,116,130,.85); border-right-color: rgba(91,116,130,.34); animation: spin 7s linear infinite; }
  .ring-2 { inset: -22px; border-bottom-color: rgba(38,42,48,.55); border-left-color: rgba(91,116,130,.38); animation: spin 11s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar { width: 100%; height: 100%; border-radius: 50%; padding: 9px; background: linear-gradient(145deg, #ffffff, #cfd7d8 58%, #8fa4b0); box-shadow: 0 18px 44px rgba(91,116,130,.16); }
  .avatar svg, .avatar img { width: 100%; height: 100%; display: block; border-radius: 50%; background: #e7dfd1; object-fit: cover; }
  .status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #3a4047;
    background: rgba(255,255,255,.42); border: 1px solid rgba(91,116,130,.35); border-radius: 999px; padding: 6px 16px; box-shadow: 0 0 18px rgba(91,116,130,.1); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--seal); animation: breathe 2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(169,68,56,.42); } 50% { box-shadow: 0 0 0 7px rgba(169,68,56,0); } }

  /* Hero 星光粒子 */
  .hero-sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle, #718a98, transparent 70%); opacity: 0; animation: sparkFloat linear infinite; }
  @keyframes sparkFloat { 0% { transform: translateY(12px) scale(.5); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-46px) scale(1.1); opacity: 0; } }

  /* 关键词跑马灯 */
  .marquee { overflow: hidden; border-top: 1px solid rgba(38,42,48,.1); border-bottom: 1px solid rgba(38,42,48,.1); background: rgba(91,116,130,.045); }
  .marquee-track { display: inline-flex; gap: 38px; white-space: nowrap; will-change: transform; animation: marquee 22s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .marquee-track span { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; color: #5b626b; letter-spacing: .12em; }
  .marquee-track span::after { content: "✦"; color: #5b7482; font-size: 12px; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ============ 章节标题 ============ */
  .sec-head { position: relative; }
  .sec-index { position: absolute; left: -2px; top: -40px; z-index: 0; pointer-events: none; font-weight: 700; font-size: 64px; line-height: 1; color: #5b7482; opacity: .1; font-family: 'Zhi Mang Xing', 'STXingkai', 'KaiTi', 'Noto Serif SC', cursive; letter-spacing: .03em; }
  .sec-head h2 { position: relative; display: inline-block; }
  .sec-head h2::after { content: ""; position: absolute; left: 0; bottom: -12px; height: 7px; width: 0; border-radius: 999px 2px 999px 2px;
    background: linear-gradient(90deg, transparent, rgba(91,116,130,.16) 8%, rgba(38,42,48,.72) 32%, rgba(169,68,56,.62) 62%, transparent 94%);
    filter: blur(.2px); transition: width .9s cubic-bezier(.22,.61,.36,1); }
  .sec-head.in-view h2::after { width: 96px; }
  @media (max-width: 640px) { .sec-index { font-size: 46px; top: -28px; } }

  /* Tabs 选中态（渐变高亮） */
  .tab[aria-selected="true"] { background: linear-gradient(135deg, #262a30, #5b7482); color: #fff; box-shadow: 0 4px 14px rgba(38, 42, 48, .18); }

  /* ============ 亮点看板 ============ */
  .stat::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, #5b7482, #a94438); opacity: .68; border-radius: 1rem 1rem 0 0; }

  /* ============ 经历时间轴 ============ */
  .timeline { position: relative; padding-left: 28px; display: grid; gap: 18px; }
  .timeline::before { content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(180deg, #5b7482, #262a30); opacity: .28; border-radius: 2px; }
  .tl-item::before { content: ""; position: absolute; left: -26px; top: 30px; width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #8fa4b0 55%, #5b7482); box-shadow: 0 0 0 4px #f5f0e6, 0 0 12px rgba(91,116,130,.35); }
  .points li { position: relative; padding-left: 20px; }
  .points li::before { content: ""; position: absolute; left: 2px; top: 10px; width: 7px; height: 7px; border-radius: 2.5px;
    background: linear-gradient(135deg, #8fa4b0, #5b7482); transform: rotate(45deg); }

  /* ============ 技能进度条 ============ */
  .bar-fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #5b7482, #262a30); position: relative; overflow: hidden; }
  .bar-fill::before { content: ""; position: absolute; right: 1px; top: 50%; transform: translateY(-50%); width: 7px; height: 7px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 9px 2px rgba(38,42,48,.25); }
  .bar-fill.loading::before { animation: dotPulse .7s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100% { box-shadow: 0 0 6px 1px rgba(38,42,48,.22); } 50% { box-shadow: 0 0 14px 4px rgba(38,42,48,.45); } }
  .bar-fill.filled::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,.65) 50%, transparent 75%); transform: translateX(-100%); animation: barSheen 2.8s ease-in-out infinite; }
  @keyframes barSheen { 0% { transform: translateX(-100%); } 55%,100% { transform: translateX(100%); } }

  /* ============ 证书墙画廊 ============ */
  .cert-wall { margin-top: 26px; padding: 28px 26px 30px; border-radius: 22px; border: 1px solid rgba(38,42,48,.12);
    background: radial-gradient(700px 260px at 12% 0%, rgba(255,255,255,.7), transparent 60%), radial-gradient(600px 240px at 92% 100%, rgba(91,116,130,.1), transparent 60%), rgba(255,255,255,.44);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 14px 40px rgba(58,53,45,.1); }
  .gallery-bar { width: 4px; height: 26px; border-radius: 4px; background: linear-gradient(180deg, #5b7482, #a94438); box-shadow: 0 0 12px rgba(91,116,130,.18); }
  .cert-stat-ico { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(135deg, #5b7482, #3a4047); box-shadow: 0 4px 12px rgba(38,42,48,.16); }
  .cert-stat-num { font-size: 21px; font-weight: 800; line-height: 1.1; color: #262a30; }

  .cert-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .cert-stat-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(38,42,48,.1);
    background: rgba(255,255,255,.42); color: #262a30; cursor: pointer; text-align: left; transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease; }
  .cert-stat-item:hover { border-color: rgba(91,116,130,.38); box-shadow: 0 8px 20px rgba(58,53,45,.08); transform: translateY(-1px); }
  .cert-stat-item strong { display: block; font-size: 18px; font-weight: 800; color: #262a30; }
  .cert-stat-item small { display: block; margin-top: 2px; font-size: 12px; color: #6c747c; }

  .cert-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .cert-filter-btn { border: 1px solid rgba(38,42,48,.12); background: rgba(255,255,255,.38); color: #525a62; border-radius: 999px;
    padding: 8px 15px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s ease; }
  .cert-filter-btn:hover { color: #15181c; border-color: rgba(91,116,130,.4); }
  .cert-filter-btn.active { color: #fff; background: linear-gradient(135deg, #262a30, #5b7482); border-color: transparent; box-shadow: 0 5px 14px rgba(38,42,48,.16); }

  .cert-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; perspective: 1200px; }
  .cert-fig { position: relative; margin: 0; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; cursor: zoom-in;
    border: 1px solid rgba(38,42,48,.12); background: rgba(255,255,255,.52);
    box-shadow: 0 10px 30px rgba(58,53,45,.12), inset 0 0 0 1px rgba(91,116,130,.12);
    transition: box-shadow .22s ease, border-color .22s ease; }
  .cert-fig:hover { border-color: rgba(91,116,130,.5); box-shadow: 0 14px 34px rgba(58,53,45,.18), 0 0 22px rgba(91,116,130,.14), inset 0 0 0 1px rgba(91,116,130,.28); }
  .cert-fig.tilt::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 3; pointer-events: none;
    background: radial-gradient(220px circle at var(--mx,50%) var(--my,50%), rgba(91,116,130,.16), transparent 68%); opacity: 0; transition: opacity .25s ease; }
  .cert-fig.tilt:hover::before { opacity: 1; }

function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
}

/* 邮箱拼接（防爬虫） */

/* 缺失信息处理：裁剪含【待补】的分句，整句缺失则隐藏 */
function cleanPoint(text) {
  if (!text) return null;
  const parts = String(text).split(/，|,/).map(s => s.trim()).filter(s => s && !/【待补】|待补/.test(s));
  const out = parts.join('，');
  return out.length >= 8 ? out : null;
}

function groupBy(items, key) {
  const map = new Map();
  items.forEach(it => {
    const k = it[key] || '其他';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(it);
  });
  return [...map.entries()].map(([label, list]) => ({ label, items: list }));
}

/* Canvas 水墨涟漪：雨滴下落触发涟漪，鼠标移动也会带出大涟漪 */
function renderWaterRipples() {
  if (REDUCED) return;
  const canvas = h('canvas', { id: 'ripples', 'aria-hidden': 'true' });
  document.body.prepend(canvas);
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, raf = null, running = false, lastRain = 0, lastMove = 0;
  const ripples = [], drops = [];
  const TAU = Math.PI * 2;
  const spawnRipple = (x, y, scale) => {
    const squash = 0.3 + Math.random() * 0.22;
    const max = (scale || 1) * (56 + Math.random() * 148);
    ripples.push({
      x: x, y: y,
      rx: 0,
      ry: 0,
      max: max,
      speed: 0.34 + Math.random() * 0.56,
      alpha: 0.2 + Math.random() * 0.22,
      line: 1.0 + Math.random() * 1.8,
      squash: squash,
      phase: Math.random() * TAU
    });
  };
  const spawnRain = () => {
    drops.push({
      x: Math.random() * W,
      y: -40 - Math.random() * 120,
      vy: 2.1 + Math.random() * 3.6,
      len: 16 + Math.random() * 30,
      endY: H * (0.22 + Math.random() * 0.68)
    });
  };
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (drops.length < 12) {
      for (let i = 0; i < 12; i++) spawnRain();
    }
  };
  const step = () => {
    ctx.clearRect(0, 0, W, H);
    if (Date.now() - lastRain > 260 && drops.length < 34) {
      spawnRain();
      lastRain = Date.now();
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.y += d.vy;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x, d.y - d.len);
      ctx.strokeStyle = 'rgba(8, 10, 12, .62)';
      ctx.lineWidth = 1.35;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, 1.8, 3.2, 0, 0, TAU);
      ctx.fillStyle = 'rgba(8, 10, 12, .5)';
      ctx.fill();
      if (d.y >= d.endY) {
        spawnRipple(d.x, d.endY, 1.55);
        drops.splice(i, 1);
      }
    }
    for (const r of ripples) {
      r.rx += r.speed;
      r.ry = Math.max(1, r.rx * r.squash);
      const p = Math.min(1, r.rx / r.max);
      const fade = (1 - p) * (0.74 + 0.26 * Math.sin(r.phase + p * 8));
      if (fade <= 0) continue;
      if (p < 0.16) {
        ctx.beginPath();
        ctx.arc(r.x, r.y, 2.2 * (1 - p * 3), 0, TAU);
        ctx.fillStyle = 'rgba(8, 10, 12, ' + (r.alpha * 0.9 * (1 - p * 4)).toFixed(3) + ')';
        ctx.fill();
      }
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.rx, r.ry, 0, 0, TAU);
      ctx.strokeStyle = 'rgba(8, 10, 12, ' + (r.alpha * fade).toFixed(3) + ')';
      ctx.lineWidth = r.line * (1 - p * 0.55) + 0.75;
      ctx.stroke();
      if (r.rx > r.max * 0.18) {
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, r.rx - r.max * 0.16, r.ry - r.max * 0.05, 0, 0, TAU);
        ctx.strokeStyle = 'rgba(8, 10, 12, ' + (r.alpha * fade * 0.72).toFixed(3) + ')';
        ctx.lineWidth = 0.65;
        ctx.stroke();
      }
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      if (ripples[i].rx >= ripples[i].max) ripples.splice(i, 1);
    }
    raf = requestAnimationFrame(step);
  };
  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', e => {
    if (!FINE_POINTER || Date.now() - lastMove < 130) return;
    lastMove = Date.now();
    spawnRipple(e.clientX, e.clientY, 2.05);
  }, { passive: true });
  window.addEventListener('pointerdown', e => {
    if (REDUCED) return;
    spawnRipple(e.clientX, e.clientY, 2.9);
  }, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); running = false; }
    else if (!running) { running = true; step(); }
  });
  resize();
  running = true;
  step();
}

/* ================================================================
 * 背景音乐：Web Audio API 合成轻柔纯音乐
 * ================================================================ */
function setupMusicToggle() {
  const btn = document.getElementById('musicToggle');
  let ctx = null, masterGain = null, playing = false, schedulerId = null;
  let nextNoteTime = 0, step = 0, autoStarted = false;
  const SCALE = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25];
  const CHORDS = [
    { bass: 0, notes: [7, 9, 11] },
    { bass: 6, notes: [6, 9, 11] },
    { bass: 5, notes: [8, 10, 12] },
    { bass: 3, notes: [7, 9, 12] }
  ];
  const ARP_PATTERNS = [[0, 1, 2, 1, 0, 1, 2, 1], [0, 2, 1, 2, 0, 2, 1, 2], [0, 1, 2, 1, 2, 1, 0, 1], [0, 2, 0, 1, 2, 1, 0, 2]];
  const BPM = 60, STEP_DUR = 60 / BPM / 2;

  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = 0;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 1400; filter.Q.value = 0.5;
    const delay = ctx.createDelay(); delay.delayTime.value = 0.35;
    const feedback = ctx.createGain(); feedback.gain.value = 0.28;
    const wet = ctx.createGain(); wet.gain.value = 0.18;
    delay.connect(feedback); feedback.connect(delay);
    masterGain.connect(filter); filter.connect(ctx.destination);
    masterGain.connect(delay); delay.connect(wet); wet.connect(filter);
  }
  function playNote(freq, time, dur, vol) {
    vol = vol || 0.5;
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.08);
    gain.gain.exponentialRampToValueAtTime(vol * 0.3, time + dur * 0.5);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(time); osc.stop(time + dur + 0.1);
  }
  function playPad(freq, time, dur, vol) {
    vol = vol || 0.12;
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 3;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 1.0;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.6);
    gain.gain.linearRampToValueAtTime(vol * 0.7, time + dur * 0.6);
    gain.gain.linearRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(time); lfo.start(time); osc.stop(time + dur + 0.1); lfo.stop(time + dur + 0.1);
  }
  function playBass(freq, time, dur, vol) {
    vol = vol || 0.18;
    const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(time); osc.stop(time + dur + 0.1);
  }
  function scheduler() {
    while (nextNoteTime < ctx.currentTime + 0.3) {
      const chordIdx = Math.floor(step / 8) % CHORDS.length;
      const chord = CHORDS[chordIdx];
      const arpPat = ARP_PATTERNS[chordIdx];
      const stepInChord = step % 8;
      const noteIdx = chord.notes[arpPat[stepInChord]];
      playNote(SCALE[noteIdx], nextNoteTime, STEP_DUR * 2.2, 0.09);
      if (stepInChord === 0) {
        playBass(SCALE[chord.bass], nextNoteTime, STEP_DUR * 8 * 0.95, 0.08);
        chord.notes.forEach(n => { playPad(SCALE[n], nextNoteTime, STEP_DUR * 8 * 0.98, 0.04); });
      }
      nextNoteTime += STEP_DUR; step++;
    }
    schedulerId = setTimeout(scheduler, 80);
  }
  function start() {
    if (!ctx) init();
    if (ctx.state === 'suspended') ctx.resume();
    nextNoteTime = ctx.currentTime + 0.1; step = 0;
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.32, ctx.currentTime + 2.0);
    scheduler();
    playing = true; autoStarted = true;
    btn.classList.add('playing'); btn.classList.remove('invite');
    btn.setAttribute('aria-label', '暂停背景音乐');
  }
  function stop() {
    if (schedulerId) { clearTimeout(schedulerId); schedulerId = null; }
    if (ctx) {
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
    }
    playing = false;
    btn.classList.remove('playing');
    btn.setAttribute('aria-label', '播放背景音乐');
  }
  btn.addEventListener('click', () => { if (playing) stop(); else start(); });
  /* 自动播放：仅在可激活手势（pointerdown/mousedown/touchstart/keydown）内解锁音频 */
  function firstGesture(e) {
    if (e && e.target && e.target.closest && e.target.closest('#musicToggle')) return;
    if (autoStarted) return;
    start();
  }
  ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(evt => {
    document.addEventListener(evt, firstGesture, { once: true, passive: true });
  });
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { if (playing) ctx.suspend(); }
    else { if (playing) ctx.resume(); }
  });
}

/* ================================================================
 * Tabs 通用构建（ARIA + 键盘左右切换）
 * ================================================================ */
function wireTabs(tabs, panels) {
  const activate = (i, focus) => {
    tabs.forEach((t, k) => {
      const on = k === i;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      panels[k].hidden = !on;
    });
    if (focus) tabs[i].focus();
  };
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => activate(i));
    t.addEventListener('keydown', e => {
      let j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = tabs.length - 1;
      if (j !== null) { e.preventDefault(); activate(j, true); }
    });
  });
  activate(0);
}
function buildTabGroup(prefix, ariaLabel, groups, renderPanel) {
  const defs = [{ key: 'all', label: '全部', items: groups.flatMap(g => g.items) }, ...groups];
  const tablist = h('div', { class: 'inline-flex flex-wrap gap-1.5 p-1.5 rounded-full bg-white/40 border border-ink-900/10 mb-8', role: 'tablist', 'aria-label': ariaLabel });
  const tabs = [], panels = [];
  defs.forEach((def, i) => {
    const btn = h('button', {
      class: 'tab rounded-full px-4 py-2 text-sm font-medium text-ink-600 hover:text-ink-950 transition',
      type: 'button', id: prefix + '-tab-' + i, 'aria-controls': prefix + '-panel-' + i
    }, def.label + '（' + def.items.length + '）');
    tablist.append(btn);
    tabs.push(btn);
    const panel = h('div', { class: 'tab-panel', role: 'tabpanel', id: prefix + '-panel-' + i, 'aria-labelledby': prefix + '-tab-' + i, tabindex: '0' });
    renderPanel(panel, def.items);
    panels.push(panel);
  });
  wireTabs(tabs, panels);
  return h('div', { class: 'tab-wrap' }, tablist, ...panels);
}

/* ================================================================
 * 渲染：证书墙画廊 + 灯箱
 * ================================================================ */
function renderCertGallery() {
  const imgs = resume.certImages || [];
  if (!imgs.length) return null;

  const tagOrder = ['人工智能', '云计算', '大模型'];
  const tagIcon = { '人工智能': 'cpu', '云计算': 'cloud', '大模型': 'sparkles' };
  const items = imgs.map((c, i) => Object.assign({}, c, { _index: i }));
  const counts = {};
  items.forEach(c => { const t = c.tag || '认证'; counts[t] = (counts[t] || 0) + 1; });
  const groups = tagOrder.filter(t => counts[t]).map(t => ({ tag: t, items: items.filter(c => (c.tag || '认证') === t) }));
  if (groups.length && groups.reduce((n, g) => n + g.items.length, 0) < items.length) {
    groups.push({ tag: '其他', items: items.filter(c => !tagOrder.includes(c.tag || '认证')) });
  }

  const gallery = h('div', { class: 'cert-gallery reveal' });
  const figures = items.map((c, i) =>
    h('figure', {
      class: 'cert-fig tilt', tabindex: '0', role: 'button',
      'data-index': c._index, 'data-tag': c.tag || '认证', 'aria-label': '查看大图：' + c.label,
      style: { animationDelay: (i * 45) + 'ms' }
    },
      h('div', { class: 'cert-imgwrap' },
        h('span', { class: 'cert-num', 'aria-hidden': 'true' }, String(i + 1).padStart(2, '0')),
        h('img', { src: c.src, alt: c.label, loading: 'lazy' }),
        h('span', { class: 'cert-zoom', 'aria-hidden': 'true' }, icon('zoom', 15))
      ),
      h('figcaption', { class: 'cert-info' },
        h('span', { class: 'cert-title' }, c.label),
        h('span', { class: 'cert-tag' }, c.tag || '认证')
      )
    )
  );
  figures.forEach(f => gallery.append(f));

  const filterDefs = [{ label: '全部', tag: '全部' }, ...groups.map(g => ({ label: g.tag, tag: g.tag }))];
  const filterBar = h('div', { class: 'cert-filter', role: 'group', 'aria-label': '证书分类' });
  const filterBtns = filterDefs.map(def => {
    const n = def.tag === '全部' ? items.length : (counts[def.tag] || 0);
    const btn = h('button', {
      class: 'cert-filter-btn', type: 'button', 'data-tag': def.tag,
      'aria-pressed': 'false'
    }, def.label + ' · ' + n);
    filterBar.append(btn);
    return btn;
  });

  let visible = items.slice();
  let cur = 0, lastFocus = null;
  const setFilter = (tag, btn) => {
    visible = tag === '全部' ? items.slice() : items.filter(c => (c.tag || '认证') === tag);
    figures.forEach(f => { f.hidden = !visible.some(c => c._index === +f.dataset.index); });
    filterBtns.forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    gallery.classList.remove('visible');
    requestAnimationFrame(() => gallery.classList.add('visible'));
  };
  filterBtns.forEach((btn, idx) => {
    btn.addEventListener('click', () => setFilter(btn.dataset.tag, btn));
    if (idx === 1) setFilter(btn.dataset.tag, btn);
  });

  const lbImg = h('img', { class: 'lb-img', alt: '' });
  const lbCap = h('p', { class: 'lb-cap', 'aria-live': 'polite' });
  const lightbox = h('div', { class: 'lightbox', id: 'lightbox', role: 'dialog', 'aria-modal': 'true', 'aria-label': '证书大图预览' },
    h('button', { class: 'lb-close', type: 'button', 'aria-label': '关闭预览' }, icon('close', 20)),
    lbImg, lbCap
  );
  document.body.append(lightbox);

  const show = idx => {
    cur = (idx + visible.length) % visible.length;
    const c = visible[cur];
    lbImg.src = c.src; lbImg.alt = c.label;
    lbCap.textContent = c.label + ' · ' + (cur + 1) + ' / ' + visible.length;
    lastFocus = document.activeElement;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    lightbox.querySelector('.lb-close').focus();
  };
  const openLb = rawIndex => {
    const idx = visible.findIndex(c => c._index === rawIndex);
    if (idx > -1) show(idx);
  };
  const closeLb = () => { lightbox.classList.remove('open'); document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); };

  gallery.addEventListener('click', e => { const fig = e.target.closest('.cert-fig'); if (fig) openLb(+fig.dataset.index); });
  gallery.addEventListener('keydown', e => { const fig = e.target.closest('.cert-fig'); if (fig && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLb(+fig.dataset.index); } });
  lightbox.addEventListener('click', e => { if (e.target === lightbox || e.target.closest('.lb-close')) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowRight') show(cur + 1);
    else if (e.key === 'ArrowLeft') show(cur - 1);
  });

  const stats = h('div', { class: 'cert-stats' },
    filterDefs.slice(1).map(def => {
      const t = def.tag;
      return h('button', {
        class: 'cert-stat-item', type: 'button', 'data-tag': t,
        onclick: () => setFilter(t, filterBtns.find(b => b.dataset.tag === t))
      },
        h('span', { class: 'cert-stat-ico', 'aria-hidden': 'true' }, icon(tagIcon[t] || 'award', 18)),
        h('span', {}, h('strong', {}, counts[t] + ' 项'), h('small', {}, t + '认证'))
      );
    })
  );

  return h('div', { class: 'cert-wall reveal' },
    h('div', { class: 'flex items-center gap-3 flex-wrap mb-5' },
      h('span', { class: 'gallery-bar', 'aria-hidden': 'true' }),
      h('div', {}, h('h3', { class: 'text-lg font-bold text-ink-950' }, '证书墙'), h('p', { class: 'text-xs text-ink-600/80' }, '按类别浏览认证证书，点击任意一张查看原件')),
      h('span', { class: 'ml-auto inline-flex items-center gap-1.5 text-xs font-semibold text-water-600 bg-water-500/10 border border-water-600/20 rounded-full px-3 py-1.5' }, icon('award', 14), '共 ' + items.length + ' 项认证')
    ),
    stats,
    filterBar,
    gallery
  );
}

/* ================================================================
 * 交互：3D 倾斜 / 磁性按钮
 * ================================================================ */
function setupTilt() {
  if (!FINE_POINTER || REDUCED) return;
  document.querySelectorAll('.tilt').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      const rx = (0.5 - py) * 6.5, ry = (px - 0.5) * 6.5;
      card.style.transform = 'perspective(900px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg) translateY(-4px)';
      card.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
      card.style.setProperty('--my', (py * 100).toFixed(1) + '%');
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
  });
}
function setupMagnetic() {
  if (!FINE_POINTER || REDUCED) return;
  document.querySelectorAll('.magnetic').forEach(btn => {
    btn.addEventListener('mousemove', e => {
      const r = btn.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      btn.style.transform = 'translate(' + (dx * .22).toFixed(1) + 'px,' + (dy * .28).toFixed(1) + 'px)';
    });
    btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
  });
}

/* ================================================================
 * 交互：数字滚动 / 进度条 / 滚动监听 / 章节进入
 * ================================================================ */
function countUp(el, dur) {
  if (el.dataset.done) return;
  el.dataset.done = '1';
  const target = parseFloat(el.dataset.count);
  const suffix = el.dataset.suffix || '';
  if (REDUCED || isNaN(target)) { el.textContent = target + suffix; return; }
  dur = dur || 900;
  const t0 = performance.now();
  (function tick(now) {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * eased) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}
function fillSkillBar(bar) {
  if (bar.dataset.done) return;
  bar.dataset.done = '1';
  const level = parseFloat(bar.dataset.level);
  const delay = parseInt(bar.dataset.delay || '0', 10);
  const pct = bar.closest('.skill-row').querySelector('.skill-pct');
  if (REDUCED || isNaN(level)) {
    bar.style.width = level + '%';
    if (pct) { pct.textContent = level + '%'; pct.dataset.done = '1'; }
    bar.classList.add('filled');
    return;
  }
  const dur = 1500, t0 = performance.now() + delay;
  bar.classList.add('loading');
  if (pct) pct.classList.add('counting');
  (function step(now) {
    const p = Math.min(1, Math.max(0, (now - t0) / dur));
    const eased = 1 - Math.pow(1 - p, 3);
    bar.style.width = (level * eased).toFixed(1) + '%';
    if (pct) pct.textContent = Math.round(level * eased) + '%';
    if (p < 1) requestAnimationFrame(step);
    else { bar.classList.remove('loading'); bar.classList.add('filled'); if (pct) { pct.classList.remove('counting'); pct.dataset.done = '1'; } }
  })(performance.now());
}
function setupReveal() {
  const reveals = document.querySelectorAll('.reveal');
  const finish = el => {
    el.classList.add('visible');
    if (el.classList.contains('stat')) {
      const num = el.querySelector('.stat-num, [data-count]');
      if (num && num.hasAttribute('data-count')) countUp(num);
    }
  };
  if (REDUCED || !('IntersectionObserver' in window)) { reveals.forEach(finish); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (!en.isIntersecting) return; finish(en.target); io.unobserve(en.target); });
  }, { threshold: 0.15 });
  reveals.forEach(el => io.observe(el));
}
function setupSkillBars() {
  const rows = document.querySelectorAll('.skill-row');
  if (!rows.length) return;
  if (REDUCED || !('IntersectionObserver' in window)) { rows.forEach(r => { const b = r.querySelector('.bar-fill'); if (b) fillSkillBar(b); }); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (!en.isIntersecting) return; const bar = en.target.querySelector('.bar-fill'); if (bar) fillSkillBar(bar); io.unobserve(en.target); });
  }, { threshold: 0.6, rootMargin: '0px 0px -10% 0px' });
  rows.forEach(r => io.observe(r));
}
function setupScrollSpy(progressBar) {
  const nav = document.getElementById('siteNav');
  const toTop = document.getElementById('toTop');
  const links = document.querySelectorAll('.nav-links a');
  const ids = NAV_LINKS.map(l => l.id);
  let ticking = false;
  const update = () => {
    ticking = false;
    const y = window.scrollY;
    nav.classList.toggle('scrolled', y > 8);
    toTop.classList.toggle('show', y > 480);
    const max = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = (max > 0 ? Math.min(100, y / max * 100) : 0) + '%';
    let current = null;
    ids.forEach(id => { const el = document.getElementById(id); if (el && el.offsetTop <= y + 130) current = id; });
    links.forEach(a => a.classList.toggle('active', a.dataset.target === current));
  };
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  window.addEventListener('resize', update);
  update();
}

/* 章节序号 + 标题下划线生长 */
function decorateSections() {
  document.querySelectorAll('.section .sec-head').forEach((head, idx) => {
    head.prepend(h('span', { class: 'sec-index', 'aria-hidden': 'true' }, String(idx + 1).padStart(2, '0')));
  });
}
function setupRoleRotate() {
  const el = document.getElementById('roleRotate');
  if (!el) return;
  const list = [resume.role, 'AI 应用探索者', '内容创作者', '校园创业者', '全栈式学习者'];
  if (REDUCED) { el.textContent = list[0]; return; }
  let i = 0;
  setInterval(() => {
    el.classList.add('swap-out');
    setTimeout(() => { i = (i + 1) % list.length; el.textContent = list[i]; el.classList.remove('swap-out'); }, 300);
  }, 2800);
}
function setupSectionInView() {
  const heads = document.querySelectorAll('.section .sec-head');
  if (REDUCED || !('IntersectionObserver' in window)) { heads.forEach(h => h.classList.add('in-view')); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in-view'); io.unobserve(en.target); } });
  }, { threshold: 0.25 });
  heads.forEach(h => io.observe(h));
}

window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.reveal, .hero-in').forEach(el => el.classList.add('visible'));
  document.querySelectorAll('.bar-fill').forEach(b => { b.style.width = b.dataset.level + '%'; b.dataset.done = '1'; });
  document.querySelectorAll('[data-count]').forEach(el => { if (!el.dataset.done) { el.textContent = el.dataset.count + (el.dataset.suffix || ''); el.dataset.done = '1'; } });
  const typed = document.getElementById('typeText');
  if (typed) typed.textContent = '个人简历 / PORTFOLIO';
});

/* ================================================================
 * 启动
 * ================================================================ */
(function init() {
  const main = document.getElementById('main');
  renderGlow();
  renderWaterRipples();
  const progressBar = renderProgressBar();
  renderCursorGlow();
  renderNav();
  renderHero(main);
  renderHighlights(main);
  renderExperience(main);
  renderProjects(main);
  renderSkills(main);
  renderEducation(main);
  renderFooter();
  setupReveal();
  setupSkillBars();
  setupTilt();
  setupMagnetic();
  setupScrollSpy(progressBar);
  decorateSections();
  setupRoleRotate();
  setupSectionInView();
  /* Lucide 图标：将所有 <i data-lucide> 占位替换为 SVG */
  if (window.lucide) lucide.createIcons();
})();
</script>
